# Dependabot version updates (ADR-0001 V-5, T-02). Dependabot security alerts
# and updates are repository settings and must be verified there separately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    # TypeScript majors stay manual: typescript-eslint does not support TS 7
    # yet (typescript-eslint/typescript-eslint#10940), so #120 was closed by
    # the sponsor on 2026-10-30. Remove once typescript-eslint supports it.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: "ci(deps)"
