# Manual GitHub Pages deployment (T-20, issue #39; ADR-0001 hosting, V-7).
#
# Publishing is a deliberate act: this workflow has ONLY a workflow_dispatch
# trigger, so pushes, pull requests and merges never publish the site. Run it
# from the Actions tab ("Deploy to GitHub Pages (manual)" > Run workflow) with
# the branch set to `main`. Every job is skipped on any other ref, and the
# `github-pages` environment must also allow only the branch `main` (a rule of
# ref type Branch, no tag rules) in the repository settings (see
# docs/ops/deploy-github-pages.md); that server-side rule is the real
# enforcement, because a workflow file on another branch could be edited.
#
# The build job re-runs the repository's own gates on the exact commit being
# published; it never relaxes them. E2E and Lighthouse already run in ci.yml on
# every push to main, so check CI is green on that commit before deploying.
name: Deploy to GitHub Pages (manual)

on:
  workflow_dispatch:
    inputs:
      accept_below_release_thresholds:
        description: >-
          Sponsor go/no-go: publish even if the question bank is below the
          US-8.1 release thresholds (content:validate:release). Leave unticked
          for a normal release.
        type: boolean
        default: false

# Least privilege by default; the deploy job alone gets Pages write access.
permissions:
  contents: read

# One deployment at a time; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate (main only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # configure-pages reads the site's Pages configuration
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (npm ci, engine-strict)
        run: npm ci

      - name: Dependency audit (high and above)
        run: npm audit --audit-level=high

      - name: Lint, typecheck, content validation, unit tests
        run: npm run check

      - name: Release content thresholds (US-8.1)
        env:
          ACCEPT_BELOW_THRESHOLDS: ${{ inputs.accept_below_release_thresholds }}
        run: |
          record() {
            {
              echo "### Release content thresholds: $1"
              echo "- accept_below_release_thresholds: $ACCEPT_BELOW_THRESHOLDS"
              echo "- commit: $GITHUB_SHA"
              echo "- started by: $GITHUB_ACTOR (this attempt: $GITHUB_TRIGGERING_ACTOR)"
            } >> "$GITHUB_STEP_SUMMARY"
          }
          status=0
          npm run --silent content:validate:release > release.log 2>&1 || status=$?
          cat release.log
          if [ "$status" -eq 0 ]; then
            record "met"
            exit 0
          fi
          # Only a pure threshold miss (exit 1, every error on a bank-level
          # "reviewed.*" field) can be overridden; any other failure stops here.
          if [ "$status" -ne 1 ] || ! grep -q '^error: ' release.log || grep '^error: ' release.log | grep -vq '› reviewed\.'; then
            echo "::error::content:validate:release failed for a reason other than the US-8.1 thresholds."
            exit 1
          fi
          if [ "$ACCEPT_BELOW_THRESHOLDS" = "true" ]; then
            echo "::warning title=Release thresholds not met::Publishing below the US-8.1 release thresholds because the sponsor ticked accept_below_release_thresholds."
            record "NOT met, sponsor override"
          else
            echo "::error title=Release thresholds not met::The question bank is below the US-8.1 release thresholds. Add content, or run again with accept_below_release_thresholds ticked if the sponsor approves."
            record "NOT met, deployment stopped"
            exit 1
          fi

      - name: Production build (content build, typecheck, Vite)
        run: npm run build

      - name: Size budgets (same flags as ci.yml)
        run: npm run size -- --require-data

      - name: CSP meta present, no inline script or style
        run: npm run csp:check

      - name: Built bank holds reviewed questions only
        run: npm run content:check-dist

      - name: Verify the artifact layout for the /api-quiz-app/ subpath
        run: |
          set -eu
          test -f dist/index.html
          test -f dist/404.html
          # Every script and stylesheet must load from the repository subpath.
          if grep -Eo '(src|href)="/[^"]*"' dist/index.html | grep -v '"/api-quiz-app/'; then
            echo "::error::dist/index.html references an asset outside /api-quiz-app/"
            exit 1
          fi
          grep -q 'src="/api-quiz-app/assets/' dist/index.html
          # No source maps or local secrets in what gets published.
          if find dist -name '*.map' -o -name '.env*' | grep .; then
            echo "::error::dist contains source maps or env files"
            exit 1
          fi
          echo "Artifact files:"
          find dist -type f | sort

      - name: Check the Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Base path matches the Vite base
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ "$BASE_PATH" != "/api-quiz-app" ]; then
            echo "::error::Pages base_path is '$BASE_PATH' but vite.config.ts builds for /api-quiz-app/"
            exit 1
          fi

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    name: Deploy to github-pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # If the repository ever becomes private, deploy-pages may also need
    # `actions: read` to fetch the artifact (SEC-R12 I-1).
    permissions:
      pages: write # publish the uploaded artifact
      id-token: write # OIDC token that deploy-pages uses to prove this run's origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    name: Verify the live site (V-7)
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Smoke-check the deployed site
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -eu
          url="${PAGE_URL%/}/"
          echo "Checking $url"
          # Pages can take a moment to serve a new deployment.
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS --max-time 20 --proto '=https' -o page.html -w '%{http_code}' "$url" || true)
            [ "$code" = "200" ] && break
            echo "HTTP $code, retrying in 10 s"; sleep 10
          done
          [ "$code" = "200" ] || { echo "::error::$url returned HTTP $code"; exit 1; }
          grep -q 'http-equiv="Content-Security-Policy"' page.html || { echo "::error::CSP meta missing on the live page"; exit 1; }
          script=$(grep -Eo 'src="/api-quiz-app/assets/[^"]+\.js"' page.html | head -1 | sed 's/^src="//; s/"$//')
          [ -n "$script" ] || { echo "::error::no app script found in the live page"; exit 1; }
          origin=$(printf '%s' "$url" | sed -E 's#^(https?://[^/]+).*#\1#')
          js=$(curl -sS --max-time 20 --proto '=https' -o /dev/null -w '%{http_code}' "$origin$script" || true)
          [ "$js" = "200" ] || { echo "::error::$origin$script returned HTTP $js"; exit 1; }
          nf=$(curl -sS --max-time 20 --proto '=https' -o notfound.html -w '%{http_code}' "${url}no-such-page" || true)
          [ "$nf" = "404" ] && grep -q 'Page not found' notfound.html || { echo "::error::unknown path did not get the static 404 page (HTTP $nf)"; exit 1; }
          http_url=$(printf '%s' "$url" | sed 's#^https://#http://#')
          redirect=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code} %{redirect_url}' "$http_url" || true)
          case "$redirect" in
            30[178]\ https://*) echo "HTTPS enforced: $redirect" ;;
            *) echo "::error::HTTP is not redirected to HTTPS ($redirect). Tick 'Enforce HTTPS' in Settings > Pages."; exit 1 ;;
          esac
          {
            echo "### Live site verified"
            echo "- $url: HTTP 200 with the CSP meta"
            echo "- app script $script: HTTP 200"
            echo "- unknown path: HTTP 404 with the static fallback page"
            echo "- http:// redirects to https:// ($redirect)"
          } >> "$GITHUB_STEP_SUMMARY"
