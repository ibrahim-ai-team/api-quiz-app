# CI for ApiQuiz (T-02, issue #22). Gates: docs/qa/test-strategy.md section 5.
#
# Every third-party action is pinned by full 40-character commit SHA with the
# release tag as a comment (tech-lead standard 15). Dependabot (github-actions)
# proposes SHA updates. The default GITHUB_TOKEN permission is read-only.
name: CI

on:
  pull_request:
    # Defaults plus `labeled`, so adding the `e2e-full` label re-runs CI with
    # the full E2E set. A plain re-run reuses the original event payload (and
    # its labels), so without `labeled` the label would only apply on the next
    # push.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; never cancel runs on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, typecheck, test, build, budgets, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (npm ci, engine-strict)
        run: npm ci

      - name: Audit dependencies (high and critical fail)
        run: npm audit --audit-level=high

      - name: Check (lint, lint fixtures, typecheck, content:validate, unit tests)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Dist content check self-test (draft, 0 or 2 banks, malformed must fail)
        run: npm run content:check-dist:selftest

      - name: Dist content check (exactly one bank asset, no draft questions)
        run: npm run content:check-dist

      - name: CSP check self-test (missing meta and inline script must fail)
        run: npm run csp:selftest

      - name: CSP check on dist/index.html (meta present, no inline script or style)
        run: npm run csp:check

      - name: Size budget self-test (250 kB fixture must fail)
        run: npm run size:selftest

      - name: Size budget (JS <= 200 kB gzip, data <= 60 kB gzip; bank asset required)
        run: npm run size -- --require-data

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Read-only: no PR comment, so no pull-requests: write is needed.
          comment-summary-in-pr: never

  # INFORMATIONAL ONLY - NOT A REQUIRED CHECK. Evaluates Node 24 (ADR-0001
  # amendment A2) while the project is pinned to Node 22 via .nvmrc and
  # engines. continue-on-error keeps a failure here from failing the workflow;
  # do not add this job to branch protection or rulesets.
  node24-compat:
    name: Node 24 compatibility (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install (engine check relaxed for this evaluation only)
        run: npm ci --engine-strict=false

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

  # E2E (T-03, issue #23; ADR-0001 V-4, tech-lead adjustments 2 and 4).
  # Playwright runs against `npm run build && npm run preview` (webServer in
  # playwright.config.ts). PRs run the PR set (Chromium at 6 viewports plus a
  # WebKit iPhone project). Pushes to main, and PRs labelled `e2e-full`, add
  # Firefox and the full device set (E2E_FULL=1). retries: 1 in CI; a pass on
  # retry is reported as flaky and logged by QA (not auto-failed).
  # The tests are split over 4 parallel shards (Playwright --shard) so the full
  # set (about 1,500 tests) does not run on a single 2-worker runner; the `e2e`
  # job below keeps the original check name and fails unless every shard passed.
  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # Browser OS-dependency installation can be slow on GitHub-hosted runners.
    # Keep enough headroom for setup plus the sharded E2E suite.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_FULL: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e-full')) && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (npm ci, engine-strict)
        run: npm ci

      - name: Validate E2E fixture banks (T-EC-US7-c drift guard)
        run: npm run e2e:fixtures

      - name: Install Playwright browsers (Chromium, WebKit)
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright Firefox (full set only)
        if: env.E2E_FULL == '1'
        run: npx playwright install --with-deps firefox

      - name: E2E (Playwright, shard ${{ matrix.shard }}/4)
        run: npm run e2e -- --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report (also on failure; skipped if cancelled)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: E2E (Playwright; full set on main or label e2e-full)
    needs: e2e-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every E2E shard passed
        env:
          SHARDS_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "E2E shards: $SHARDS_RESULT"
          [ "$SHARDS_RESULT" = "success" ]

  # Lighthouse CI (T-18, issue #38; SC-5; tech-lead adjustments 2 and 5).
  # Mobile preset (Lighthouse default), 3 runs against `npm run preview` at
  # http://localhost:4173/api-quiz-app/ (not staticDistDir, because of the
  # /api-quiz-app/ base). The median must reach Performance >= 0.90 and
  # Accessibility >= 0.95 (lighthouserc.json). Reports go to .lighthouseci/
  # (filesystem target) and are uploaded as an artifact; nothing is sent to
  # third-party storage, and no secret is needed. ubuntu-latest ships Google
  # Chrome, which LHCI finds without CHROME_PATH.
  lighthouse:
    name: Lighthouse (mobile, median of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No npm cache in this job: it runs an unlocked npx tree (SEC-R11 F3).

      - name: Install (npm ci, engine-strict)
        run: npm ci

      - name: Build
        run: npm run build

      # @lhci/cli is deliberately NOT a devDependency: its transitive tree has
      # high advisories with no fixed release (extract-zip via puppeteer), and
      # the npm audit gate in the `ci` job must stay strict. It runs here only,
      # pinned via npx, with read-only permissions and no secrets (sponsor
      # decision on T-18, PR for #38). Hardening (SEC-R11): install scripts are
      # disabled for this step only, and the script's `--before` date freezes
      # transitive resolution. lighthouserc.json's --no-sandbox is for this
      # throwaway runner loading only the local first-party build; do not copy
      # it to a context that loads untrusted URLs.
      - name: Lighthouse CI (collect 3 runs, assert median, write .lighthouseci/)
        env:
          npm_config_ignore_scripts: "true"
        run: npm run lighthouse

      - name: Upload Lighthouse reports (also on failure)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: .lighthouseci/
          # .lighthouseci is a dot-directory; upload-artifact skips hidden
          # files by default. It holds only Lighthouse reports.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
