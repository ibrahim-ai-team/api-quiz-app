# Question report form (T-22, issue #40; US-3.5, US-3.6, US-12.1).
# Contract with src/ui/report/reportLink.ts: the file name and the input ids
# `question-id` and `content-version` must not change unless both sides change
# together. GitHub prefills an issue form field from the URL query parameter
# named after the field id.
name: Report a problem with a question
description: Tell us about a wrong answer, unclear wording, an outdated source or a typo in an ApiQuiz question.
title: "[Question] "
body:
  - type: markdown
    attributes:
      value: |
        **This issue will be public.** Issues and GitHub usernames on this repository can be seen by anyone.
        Please do not include personal data, such as your name, email address, employer or location, or any other information about you or other people.
        Only describe the problem with the question.
  - type: input
    id: question-id
    attributes:
      label: Question ID
      description: Filled in automatically when you use the "Report a problem with this question" link in the app. Leave it empty for a general report.
      placeholder: e.g. http-001
    validations:
      required: false
  - type: input
    id: content-version
    attributes:
      label: Content version
      description: Filled in automatically by the app. It tells us which version of the question bank you saw.
    validations:
      required: false
  - type: dropdown
    id: problem-category
    attributes:
      label: What is wrong with the question?
      description: Choose the option that fits best.
      multiple: false
      options:
        - Wrong answer key
        - Unclear or ambiguous wording
        - Outdated or incorrect source
        - Typo
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Explain what is wrong and, if you can, what the correct answer or wording should be. A link to a primary source (for example an RFC or an official specification) helps. Do not include personal data.
    validations:
      required: true
